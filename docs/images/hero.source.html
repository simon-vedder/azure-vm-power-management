<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source of hero.png. Render: "Google Chrome" --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1.5 --window-size=1600,640 --screenshot=hero.png file://$PWD/hero.source.html -->
<style>
  html,body{margin:0;padding:0;background:#0b1220;}
  body{width:1600px;height:640px;overflow:hidden;font-family:-apple-system,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;}
  svg{display:block}
  .mono{font-family:"SF Mono",Menlo,Consolas,monospace}
</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <radialGradient id="glow" cx="1250" cy="320" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078d4" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#0078d4" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0078d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0e1a33"/>
    </linearGradient>
    <linearGradient id="chain" x1="80" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>

  <!-- left: name and promise. Keep the tagline under ~55 characters. -->
  <text x="80" y="150" fill="#38bdf8" font-size="18" font-weight="700" letter-spacing="5">AZURE  ·  POWERSHELL</text>
  <text x="76" y="230" fill="#ffffff" font-size="72" font-weight="800" letter-spacing="-2">AzureVMPowerManagement</text>
  <text x="80" y="288" fill="#aab4c8" font-size="28" font-weight="400">Tag a VM with the schedule it belongs to. The controller does the rest, and shows you what it did.</text>
  <text x="80" y="330" fill="#6f7d99" font-size="21">Read-only by default · rules you can read · backup before every change</text>
  <text x="80" y="362" fill="#6f7d99" font-size="21">PowerShell Gallery module · MIT</text>

  <g class="mono" font-size="19">
    <line x1="80" y1="470" x2="760" y2="470" stroke="url(#chain)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="470" r="9" fill="#0b1220" stroke="#38bdf8" stroke-width="3"/>
    <text x="80" y="510" fill="#8fd3ff" text-anchor="start" font-weight="600">Get</text>
    <circle cx="420" cy="470" r="9" fill="#0078d4" stroke="#38bdf8" stroke-width="3"/>
    <text x="420" y="510" fill="#8fb8ec" text-anchor="middle">Report</text>
    <circle cx="760" cy="470" r="9" fill="#22c55e" stroke="#86efac" stroke-width="3"/>
    <text x="760" y="510" fill="#86efac" text-anchor="end" font-weight="600">Remove -WhatIf</text>
    <text x="80" y="548" fill="#55627d" font-size="17">The tool proposes, you decide.</text>
  </g>

  <!-- right: terminal card. Replace the lines with the tool's real quick start. -->
  <rect x="700" y="-200" width="1000" height="1000" fill="url(#glow)"/>
  <rect x="890" y="160" width="620" height="320" rx="26" fill="#0078d4" fill-opacity="0.25" filter="url(#soft)"/>
  <g filter="url(#shadow)">
    <rect x="900" y="150" width="600" height="320" rx="22" fill="#0f172a" stroke="#2a3650" stroke-width="2"/>
  </g>
  <circle cx="930" cy="180" r="6" fill="#ef4444"/><circle cx="952" cy="180" r="6" fill="#f59e0b"/><circle cx="974" cy="180" r="6" fill="#22c55e"/>
  <g class="mono" font-size="21">
    <text x="930" y="240" fill="#8fd3ff">PS&gt; </text><text x="985" y="240" fill="#e2e8f0">Install-Module AzureVMPowerManagement</text>
    <text x="930" y="290" fill="#8fd3ff">PS&gt; </text><text x="985" y="290" fill="#e2e8f0">Get-VmPowerPlan | Format-Table</text>
    <text x="960" y="340" fill="#f59e0b">High</text><text x="1060" y="340" fill="#aab4c8">item-01   privileged and unused</text>
    <text x="960" y="378" fill="#facc15">Medium</text><text x="1060" y="378" fill="#aab4c8">item-02   privileged and in use</text>
    <text x="930" y="440" fill="#8fd3ff">PS&gt; </text><text x="985" y="440" fill="#e2e8f0">... | Remove-VmPowerPlan -WhatIf</text>
  </g>
</svg>
</body></html>
